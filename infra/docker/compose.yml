services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dma
      POSTGRES_PASSWORD: dma
      POSTGRES_DB: dma
    ports: ['5432:5432']
    volumes: [db_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ['6379:6379']

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]

  reverse-proxy:
    image: nginx:alpine
    ports: ['8080:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && npm i -g pnpm && pnpm --filter @dma/api dev"
    volumes:
      - ../../:/app
    ports: ['3000:3000']
    depends_on: [db, redis, minio]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && npm i -g pnpm && pnpm --filter @dma/web dev"
    volumes:
      - ../../:/app
    ports: ['5173:5173']
    depends_on: [api]

volumes:
  db_data:
  minio_data:
